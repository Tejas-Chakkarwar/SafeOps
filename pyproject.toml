[project]
name = "safeops"
version = "0.1.0"
description = "Risk-aware remediation for AI incident-response agents in Kubernetes"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added only when a milestone first needs them (decision 0005).
dependencies = [
    "pyyaml>=6.0.2",
    "typer>=0.29.2",  # lowest version tested
    "pydantic>=2.14.3,<3",  # run record schema (Milestone 5; decision 0018)
]

[project.scripts]
safeops = "safeops.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "safeops"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
