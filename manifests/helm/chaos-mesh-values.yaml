# Chaos Mesh install values (decision 0003; F2). The version is pinned in config/cluster.yaml.
chaosDaemon:
  runtime: containerd
  socketPath: /run/containerd/containerd.sock
dashboard:
  create: false
controllerManager:
  replicaCount: 1      # 3 replicas on one kind node buy nothing and cost memory (0003 F2)
