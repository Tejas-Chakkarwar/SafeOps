# experiment-controller: the harness identity (design §4; decision 0009).
# It lives in the system namespace so it survives a testbed rebuild or quarantine.
# Milestone 2 grants it exactly one capability: proxy GET and PUT to the workload
# generator Service, by name. Its testbed rights are added at Milestone 3 with reset.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: experiment-controller
  namespace: ${SYSTEM_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: experiment-controller-workload-proxy
  namespace: ${WORKLOAD_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["${WORKLOAD_SERVICE}"]
    verbs: ["get", "update"]     # GET /stats, PUT /control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: experiment-controller-workload-proxy
  namespace: ${WORKLOAD_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: experiment-controller
    namespace: ${SYSTEM_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: experiment-controller-workload-proxy
---
# Milestone 3: testbed lifecycle rights for reset, verify_clean_state and snapshots
# (decisions 0009, 0013). Scoped to exactly what those need. No Secrets, no pods/exec,
# and nothing outside the testbed namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: experiment-controller-testbed-lifecycle
  namespace: ${TESTBED_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "delete"]  # delete: hand-made slices only (second review, R5)
  - apiGroups: ["chaos-mesh.org"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "delete"]  # reset removes chaos; injecting it is Milestone 4
  # Inventory (Milestone 3 review, H1): verify must see every other kind the testbed could
  # hold. Reset may delete stray objects of these configuration kinds...
  - apiGroups: [""]
    resources: ["serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "delete"]
  # second review, R3: inert kinds that create no pods could otherwise hide
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["replicationcontrollers", "podtemplates"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "delete"]
  # ...but only reads these. Stray ones are flagged, which leads to quarantine.
  - apiGroups: ["apps"]
    resources: ["controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: experiment-controller-testbed-lifecycle
  namespace: ${TESTBED_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: experiment-controller
    namespace: ${SYSTEM_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: experiment-controller-testbed-lifecycle
