---
apiVersion: v1
kind: Namespace
metadata:
  name: ${WORKLOAD_NAMESPACE}
  labels: {app.kubernetes.io/part-of: safeops, safeops.io/role: measurement}
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${MONITORING_NAMESPACE}
  labels: {app.kubernetes.io/part-of: safeops, safeops.io/role: telemetry}
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${CHAOS_NAMESPACE}
  labels: {app.kubernetes.io/part-of: safeops, safeops.io/role: fault-backend}
