# Postgres StatefulSet (design §12). SafeOps can never mutate this (§9.3).
# The postgres-credentials Secret is created at bootstrap with a random password that is
# never printed. SafeOps identities never get Secret access (§4).
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: ${TESTBED_NAMESPACE}
  labels: {app: postgres}
spec:
  clusterIP: None              # headless: governing Service for the StatefulSet
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ${TESTBED_NAMESPACE}
  labels: {app: postgres}
spec:
  serviceName: postgres-svc
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: ${POSTGRES_IMAGE}
          imagePullPolicy: IfNotPresent
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: orders}
            - {name: POSTGRES_USER, value: orders}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "orders", "-d", "orders"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "orders", "-d", "orders"]}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app: postgres}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
