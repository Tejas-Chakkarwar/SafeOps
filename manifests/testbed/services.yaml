# Testbed application services (design §12; decision 0007).
# All four Deployments run the same safeops-testbed image. Behavior differs only through
# the version-controlled pod template and ConfigMaps.
#
# Pod-template env holds values that rollback_deployment must be able to repair: URLs,
# timeouts, cache size, and the log level of services with no ConfigMap. Requests,
# limits and replicas sit inside each Deployment's safe_range in config/topology.yaml
# (decision 0003, F4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ${TESTBED_NAMESPACE}
  labels: {app: gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: gateway
          image: ${TESTBED_IMAGE}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SERVICE_NAME, value: gateway}
            - {name: LOG_LEVEL, value: info}
            - {name: CACHE_MB, value: "64"}
            - {name: ORDERS_URL, value: "http://orders-svc:8080"}
            - {name: ORDERS_TIMEOUT_MS, value: "800"}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: ${TESTBED_NAMESPACE}
  labels: {app: gateway}
spec:
  selector: {app: gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: ${TESTBED_NAMESPACE}
  labels: {app: orders}
spec:
  replicas: 2
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: orders
          image: ${TESTBED_IMAGE}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SERVICE_NAME, value: orders}
            - {name: CACHE_MB, value: "64"}
            - {name: INVENTORY_URL, value: "http://inventory-svc:8080"}
            - {name: PAYMENT_URL, value: "http://payment-svc:8080"}
            - {name: UPSTREAM_TIMEOUT_MS, value: "300"}
            - {name: DB_HOST, value: postgres-svc}
            - {name: DB_NAME, value: orders}
            - {name: DB_USER, value: orders}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
            # ConfigMap-sourced: repairable by patch_configmap plus rollout-restart.
            - name: LOG_LEVEL
              valueFrom: {configMapKeyRef: {name: orders-config, key: log_level}}
            - name: DB_MAX_POOL_SIZE
              valueFrom: {configMapKeyRef: {name: db-pool-config, key: max_pool_size}}
            - name: DB_CONNECTION_TIMEOUT_MS
              valueFrom: {configMapKeyRef: {name: db-pool-config, key: connection_timeout_ms}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-svc
  namespace: ${TESTBED_NAMESPACE}
  labels: {app: orders}
spec:
  selector: {app: orders}
  ports: [{name: http, port: 8080, targetPort: http}]
---
