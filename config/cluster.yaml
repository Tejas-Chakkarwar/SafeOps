# SafeOps cluster identity (decision 0002). This is the single source of truth.
# Starting at Milestone 2, the context guard and every cluster command read these
# values from here. Nothing reads them at Milestone 1. Never hardcode them anywhere else.
#
# Changing this file changes the experimental condition (CLAUDE.md, config/).

cluster_name: safeops        # kind cluster name
kube_context: kind-safeops   # kind always prefixes contexts with "kind-"
namespace: testbed           # SafeOps testbed namespace

# Fault backend pin (decision 0003, F1). make cluster-up passes this to
# `helm install --version` starting at Milestone 2.
chaos_mesh_version: 2.8.8
