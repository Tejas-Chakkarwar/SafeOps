# Bootstrap scope (decision 0006): the exact cluster-scoped objects bootstrap may
# create. Generated by `make bootstrap-scope` from the pinned charts and SafeOps
# manifests. Review every change. cluster-up re-renders and refuses on any
# difference.
charts:
  chaos-mesh:
    chart: chaos-mesh
    version: 2.8.8
    namespace: chaos-mesh
    cluster_scoped:
    - kind: ClusterRole
      name: chaos-mesh-chaos-controller-manager-cluster-level
    - kind: ClusterRole
      name: chaos-mesh-chaos-controller-manager-target-namespace
    - kind: ClusterRole
      name: chaos-mesh-chaos-dashboard-cluster-level
    - kind: ClusterRole
      name: chaos-mesh-chaos-dashboard-target-namespace
    - kind: ClusterRole
      name: chaos-mesh-chaos-dns-server-cluster-level
    - kind: ClusterRole
      name: chaos-mesh-chaos-dns-server-target-namespace
    - kind: ClusterRoleBinding
      name: chaos-mesh-chaos-controller-manager-cluster-level
    - kind: ClusterRoleBinding
      name: chaos-mesh-chaos-controller-manager-target-namespace
    - kind: ClusterRoleBinding
      name: chaos-mesh-chaos-dashboard-cluster-level
    - kind: ClusterRoleBinding
      name: chaos-mesh-chaos-dashboard-target-namespace
    - kind: ClusterRoleBinding
      name: chaos-mesh-chaos-dns-server-cluster-level
    - kind: ClusterRoleBinding
      name: chaos-mesh-chaos-dns-server-target-namespace
    - kind: CustomResourceDefinition
      name: awschaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: azurechaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: blockchaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: dnschaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: gcpchaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: httpchaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: iochaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: jvmchaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: kernelchaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: networkchaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: physicalmachinechaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: physicalmachines.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: podchaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: podhttpchaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: podiochaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: podnetworkchaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: remoteclusters.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: schedules.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: statuschecks.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: stresschaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: timechaos.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: workflownodes.chaos-mesh.org
    - kind: CustomResourceDefinition
      name: workflows.chaos-mesh.org
    - kind: MutatingWebhookConfiguration
      name: chaos-mesh-mutation
    - kind: ValidatingWebhookConfiguration
      name: chaos-mesh-validation
    - kind: ValidatingWebhookConfiguration
      name: chaos-mesh-validation-auth
  prometheus:
    chart: prometheus
    version: 29.47.2
    namespace: safeops-monitoring
    cluster_scoped:
    - kind: ClusterRole
      name: prometheus-server
    - kind: ClusterRoleBinding
      name: prometheus-server
safeops_manifests:
  cluster_scoped:
  - kind: Namespace
    name: chaos-mesh
  - kind: Namespace
    name: safeops-monitoring
  - kind: Namespace
    name: safeops-system
  - kind: Namespace
    name: safeops-workload
  - kind: Namespace
    name: testbed
