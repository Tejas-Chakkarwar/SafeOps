# Mutation table for scripts/mutate.py (`make mutate`). Repository-development data only: not
# an experiment input, not part of any run's provenance.
#
# Each [[mutant]] replaces the exact `old` text, which must occur exactly once in `target`,
# with `new`, and at least one of the pytest nodes in `kills` must then fail on an assertion.
# `old` and `new` are TOML literal strings ('''...'''; the newline right after the opening
# quotes isn't part of the value), so the text is byte-for-byte the source text: no escapes.
#
# Historical recovery. Decisions 0022 and 0023 recorded mutation results whose definitions
# were never committed. Every recorded mutant below is ported verbatim from the original
# definitions, recovered from the session that ran them (the 0023 runner's mutant list, and
# the 0022 runs' recorded commands), not re-derived from the decisions' prose. Its `source`
# names the decision entry that recorded it, and [[recorded]] holds that entry's own count.
# The harness checks recorded = ported + unreconstructible for every source. Decision 0024
# records no mutation results.
#
# The original runs counted any failing test in the files they ran. The `kills` here name the
# semantic tests that fail for each mutant, found by running the full offline suite with the
# mutant in place, so each kill is now attributable.
#
# A mutant added later names a source outside [[recorded]] (for example "0025 ...") and isn't
# counted as historical recovery. An entry that can't be ported faithfully goes in
# [[unreconstructible]] with its reason, never as a substitute mutant.

[[recorded]]
